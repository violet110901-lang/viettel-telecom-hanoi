<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<title>Xem trước — Viettel Hà Nội (Desktop &amp; Mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--red:#EE0033;--ink:#0b0b10;--muted:#71717f;--line:#e6e6ea;--bg:#eef0f4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header .mark{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
  header h1{font-size:16px;font-weight:800}
  header h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  header .spacer{margin-left:auto}
  header a{font-size:13.5px;font-weight:600;color:#fff;background:var(--red);padding:9px 16px;border-radius:9px;text-decoration:none}
  header a.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .stage{display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:34px 22px 60px;max-width:1400px;margin:0 auto}
  .device{display:flex;flex-direction:column;align-items:center;gap:14px}
  .dlabel{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .dlabel span{font-size:12px;font-weight:500;color:var(--muted)}
  /* desktop browser mockup */
  .browser{width:718px;max-width:92vw;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(16,16,30,.18);background:#fff;border:1px solid var(--line)}
  .bbar{height:40px;background:#f4f4f6;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
  .bbar i{width:11px;height:11px;border-radius:50%;display:block}
  .bbar .r{background:#ff5f57}.bbar .y{background:#febc2e}.bbar .g{background:#28c840}
  .bbar .url{margin-left:12px;flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;font-size:11.5px;color:var(--muted);padding:5px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desk{width:718px;max-width:92vw;height:820px;overflow:hidden;position:relative}
  .desk iframe{width:1280px;height:1462px;border:0;transform:scale(.561);transform-origin:top left;background:#fff}
  /* phone mockup */
  .phone{width:394px;max-width:92vw;padding:13px;background:#0d0d12;border-radius:40px;box-shadow:0 24px 60px rgba(16,16,30,.22);position:relative}
  .phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#0d0d12;border-radius:0 0 14px 14px;z-index:2}
  .phone iframe{width:100%;height:770px;border:0;border-radius:28px;background:#fff;display:block}
  .hint{text-align:center;color:var(--muted);font-size:13px;padding:0 22px 40px}
  @media(max-width:800px){
    .stage{gap:30px;padding:24px 14px 50px}
    .desk{height:560px}
  }
</style>
</head>
<body>
<header>
  <span class="mark">V</span>
  <h1>Xem trước thiết kế<small>Viettel Hà Nội — danh bạ cửa hàng chi nhánh</small></h1>
  <div class="spacer"></div>
  <a class="ghost" href="index.html" target="_blank" rel="noopener">Mở bản đầy đủ ↗</a>
</header>

<div class="stage">
  <div class="device">
    <div class="dlabel">💻 Desktop <span>· khung 1280px</span></div>
    <div class="browser">
      <div class="bbar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="url">violet110901-lang.github.io/viettel-telecom-hanoi/</span></div>
      <div class="desk"><iframe src="index.html" title="Desktop preview" loading="lazy"></iframe></div>
    </div>
  </div>

  <div class="device">
    <div class="dlabel">📱 Mobile <span>· khung ~390px</span></div>
    <div class="phone"><iframe src="index.html" title="Mobile preview" loading="lazy"></iframe></div>
  </div>
</div>

<p class="hint">Mỗi khung là trang thật (index.html) — cuộn trong từng khung để xem. Khung desktop đang thu nhỏ để vừa màn hình.</p>
</body>
</html>
